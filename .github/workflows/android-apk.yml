
name: Gerar APK - Rota Certa 3.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verificar Android SDK 35
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK 35 disponivel!"
          echo "Build Tools 35.0.0 disponiveis!"

      - name: Verificar sintaxe Java
        shell: bash
        run: |
          bash tools/verificar-sintaxe.sh

      - name: Testar motor financeiro
        shell: bash
        run: |
          bash tools/testar-motor.sh

      - name: Executar testes Android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compilar APK Android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK nao foi gerado!"
            exit 1
          fi

          echo "APK gerado com sucesso!"
          ls -lh "$APK"
          sha256sum "$APK"

          {
            echo "## Rota Certa 3.2"
            echo ""
            echo "Compilacao concluida com sucesso."
            echo ""
            echo "Baixe RotaCerta-3.2-APK em Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RotaCerta-3.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
